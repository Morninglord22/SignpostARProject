<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Landscape Mode Page</title>
    <style>
        /* Basic styles for body and full-screen layout */
        body {
            margin: 0;
            height: 100vh; /* Full viewport height */
            display: flex;
            justify-content: center; /* Horizontally center image */
            align-items: center; /* Vertically center image */
            overflow: hidden; /* Hide overflow */
            position: relative; /* Needed for positioning the button */
        }

        /* Image styling */
        #centerImage {
            height: 100%; /* Full height of the viewport */
            width: auto; /* Maintain aspect ratio */
            display: block; /* Makes the image a block element */
        }

        /* Back button styles */
        #backButton {
            position: absolute; /* Position at the bottom left */
            bottom: 20px; /* Margin from the bottom */
            left: 200px; /* Margin from the left */
            background-color: rgba(250, 215, 0, 1); /* Yellow background */
            padding: 10px 20px; /* Padding around the text */
            border: none; /* No border */
            border-radius: 5px; /* Rounded corners */
            cursor: pointer; /* Show pointer cursor */
            font-weight: bold; /* Bold text */
        }
    </style>   
</head>
<body>
    <img id="centerImage" src="https://raw.githubusercontent.com/Morninglord22/SignpostARProject/main/Purchase%20copies.jpg" alt="Instructions">
    <button id="backButton">Back</button>

    <script>
        const backButton = document.getElementById('backButton');
        const webpageUrl = 'index.html'; // URL to go back to
        // Add event listener to the button
        backButton.addEventListener('click', function() {
            window.location.href = webpageUrl; // Redirect to the specified URL
        });
    </script> 
</body>
</html>
